services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: payguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: payguard
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U payguard"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://payguard:${POSTGRES_PASSWORD}@db/payguard
    command: [python, -m, app.manage, init-db]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    ports:
      - 127.0.0.1:8000:8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://payguard:${POSTGRES_PASSWORD}@db/payguard
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 20s
      timeout: 5s
      retries: 3
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://payguard:${POSTGRES_PASSWORD}@db/payguard
    command: [python, -m, app.worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  frontend:
    image: node:22-alpine
    working_dir: /frontend
    command: [node, dev-server.mjs]
    volumes:
      - ./frontend:/frontend:ro
    ports:
      - 127.0.0.1:3000:3000
    environment:
      FRONTEND_HOST: 0.0.0.0
      BACKEND_ORIGIN: http://api:8000
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres:
